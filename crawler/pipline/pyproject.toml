[project]
name = "pipline"
version = "0.1.0"
description = "Yanbridge 数据流水线 — 从原始 DB 数据到统一 Post 结构"
requires-python = ">=3.11"
dependencies = [
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "rapidocr-onnxruntime>=1.3",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["pipline*"]
